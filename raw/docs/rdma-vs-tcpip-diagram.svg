<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="470" viewBox="0 0 1660 470" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif">
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e8449"/>
    </marker>
  </defs>

  <rect width="1660" height="470" fill="#fafafa"/>

  <!-- ============ 左侧：传统 TCP/IP ============ -->
  <rect x="20" y="20" width="780" height="420" rx="14" fill="#fffdfc" stroke="#e74c3c" stroke-width="2"/>
  <text x="410" y="58" text-anchor="middle" font-size="20" font-weight="bold" fill="#c0392b">传统 TCP/IP 通信：4 次拷贝 · 内核全程参与 · CPU 中断不断</text>

  <!-- 节点 -->
  <g font-size="13.5" text-anchor="middle" fill="#922b21">
    <rect x="46"  y="100" width="100" height="96" rx="10" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="96"  y="138" font-size="14.5" font-weight="bold">应用 A</text>
    <text x="96"  y="160">发送缓冲区</text>

    <rect x="172" y="100" width="100" height="96" rx="10" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="222" y="138" font-size="14.5" font-weight="bold">内核协议栈</text>
    <text x="222" y="160">封包·拥塞控制</text>

    <rect x="297" y="100" width="100" height="96" rx="10" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="347" y="138" font-size="14.5" font-weight="bold">本端网卡</text>
    <text x="347" y="160">协议栈驱动</text>

    <rect x="423" y="100" width="100" height="96" rx="10" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="473" y="138" font-size="14.5" font-weight="bold">对端网卡</text>
    <text x="473" y="160">中断收包</text>

    <rect x="548" y="100" width="100" height="96" rx="10" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="598" y="138" font-size="13.5" font-weight="bold">对端内核协议栈</text>
    <text x="598" y="160">解包·校验</text>

    <rect x="674" y="100" width="100" height="96" rx="10" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="724" y="138" font-size="14.5" font-weight="bold">应用 B</text>
    <text x="724" y="160">接收缓冲区</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#c0392b" stroke-width="2">
    <line x1="146" y1="148" x2="170" y2="148" marker-end="url(#arrR)"/>
    <line x1="272" y1="148" x2="295" y2="148" marker-end="url(#arrR)"/>
    <line x1="397" y1="148" x2="421" y2="148" marker-end="url(#arrR)" stroke-dasharray="5,3"/>
    <line x1="523" y1="148" x2="546" y2="148" marker-end="url(#arrR)"/>
    <line x1="648" y1="148" x2="672" y2="148" marker-end="url(#arrR)"/>
  </g>

  <!-- 步骤徽标 -->
  <g text-anchor="middle">
    <circle cx="159"  cy="122" r="11" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
    <text x="159"  y="126.5" font-size="12" font-weight="bold" fill="#c0392b">1</text>
    <circle cx="284"  cy="122" r="11" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
    <text x="284"  y="126.5" font-size="12" font-weight="bold" fill="#c0392b">2</text>
    <circle cx="410" cy="122" r="11" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
    <text x="410" y="126.5" font-size="12" font-weight="bold" fill="#c0392b">3</text>
    <circle cx="535" cy="122" r="11" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
    <text x="535" y="126.5" font-size="12" font-weight="bold" fill="#c0392b">4</text>
    <circle cx="661" cy="122" r="11" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
    <text x="661" y="126.5" font-size="12" font-weight="bold" fill="#c0392b">5</text>
  </g>

  <!-- 图例 -->
  <text x="410" y="232" text-anchor="middle" font-size="12.5" fill="#c0392b">① 应用→内核 拷贝　② 内核→网卡 DMA　③ 网络传输　④ 网卡→对端内核 DMA　⑤ 对端内核→应用 拷贝</text>

  <!-- CPU 注释 -->
  <rect x="46" y="248" width="728" height="70" rx="10" fill="#fdecea" stroke="#f5b7b1" stroke-width="1.5"/>
  <text x="410" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#922b21">CPU 全程在线：syscall + 上下文切换 ×2 · 协议栈封包/解包 · 校验与中断处理</text>
  <text x="410" y="300" text-anchor="middle" font-size="13" fill="#922b21">数据被搬运 4 次：应用 → 内核 → 网卡 →（网络）→ 网卡 → 对端内核 → 对端应用</text>

  <!-- 指标 -->
  <g text-anchor="middle">
    <rect x="46" y="344" width="229" height="56" rx="10" fill="#fdf2e9" stroke="#e59866" stroke-width="1.5"/>
    <text x="160" y="378" font-size="14.5"><tspan font-weight="bold" fill="#ca6f1e">时延</tspan><tspan fill="#6e2c00">｜数十~数百 μs</tspan></text>
    <rect x="295" y="344" width="229" height="56" rx="10" fill="#fdf2e9" stroke="#e59866" stroke-width="1.5"/>
    <text x="409" y="378" font-size="14.5"><tspan font-weight="bold" fill="#ca6f1e">带宽</tspan><tspan fill="#6e2c00">｜受协议栈 / CPU 限制</tspan></text>
    <rect x="544" y="344" width="229" height="56" rx="10" fill="#fdf2e9" stroke="#e59866" stroke-width="1.5"/>
    <text x="658" y="378" font-size="14.5"><tspan font-weight="bold" fill="#ca6f1e">CPU 开销</tspan><tspan fill="#6e2c00">｜高（搬运+协议+中断）</tspan></text>
  </g>

  <!-- ============ VS 徽标 ============ -->
  <circle cx="830" cy="220" r="26" fill="#2c3e50"/>
  <text x="830" y="227" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">VS</text>

  <!-- ============ 右侧：RDMA ============ -->
  <rect x="860" y="20" width="780" height="420" rx="14" fill="#fcfffd" stroke="#27ae60" stroke-width="2"/>
  <text x="1250" y="58" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e8449">RDMA 通信：0 次内核拷贝 · 绕过内核 · CPU 只发起 / 收完成</text>

  <!-- 节点 -->
  <g font-size="13" text-anchor="middle" fill="#145a32">
    <rect x="886"  y="100" width="154" height="96" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
    <text x="963"  y="136" font-size="14.5" font-weight="bold">AIV / 应用 A</text>
    <text x="963"  y="158">已注册内存 MR</text>
    <text x="963"  y="178">（NPU HBM）</text>

    <rect x="1077" y="100" width="154" height="96" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
    <text x="1154" y="136" font-size="14.5" font-weight="bold">本端网卡</text>
    <text x="1154" y="158">硬件 DMA 读取</text>
    <text x="1154" y="178">（WQE 队列驱动）</text>

    <rect x="1268" y="100" width="154" height="96" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
    <text x="1345" y="136" font-size="14.5" font-weight="bold">对端网卡</text>
    <text x="1345" y="158">硬件 DMA 写入</text>
    <text x="1345" y="178">（凭 Key + 目标地址）</text>

    <rect x="1459" y="100" width="154" height="96" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
    <text x="1536" y="136" font-size="14.5" font-weight="bold">远端应用</text>
    <text x="1536" y="158">已注册内存 MR</text>
    <text x="1536" y="178">（NPU HBM）</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#1e8449" stroke-width="2">
    <line x1="1040" y1="148" x2="1075" y2="148" marker-end="url(#arrG)"/>
    <line x1="1231" y1="148" x2="1266" y2="148" marker-end="url(#arrG)" stroke-dasharray="5,3"/>
    <line x1="1422" y1="148" x2="1457" y2="148" marker-end="url(#arrG)"/>
  </g>

  <!-- 步骤徽标 -->
  <g text-anchor="middle">
    <circle cx="1058" cy="122" r="11" fill="#ffffff" stroke="#1e8449" stroke-width="1.5"/>
    <text x="1058" y="126.5" font-size="12" font-weight="bold" fill="#1e8449">1</text>
    <circle cx="1249" cy="122" r="11" fill="#ffffff" stroke="#1e8449" stroke-width="1.5"/>
    <text x="1249" y="126.5" font-size="12" font-weight="bold" fill="#1e8449">2</text>
    <circle cx="1440" cy="122" r="11" fill="#ffffff" stroke="#1e8449" stroke-width="1.5"/>
    <text x="1440" y="126.5" font-size="12" font-weight="bold" fill="#1e8449">3</text>
  </g>

  <!-- 图例 -->
  <text x="1250" y="232" text-anchor="middle" font-size="12.5" fill="#1e8449">① CPU 提交 WQE + Doorbell　② 网卡间网络传输（RoCE / IB）　③ 凭 Key + 目标地址直写远端内存</text>

  <!-- CPU 注释 -->
  <rect x="886" y="248" width="728" height="70" rx="10" fill="#eafaf1" stroke="#a9dfbf" stroke-width="1.5"/>
  <text x="1250" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#145a32">CPU 仅在两端出现：发起（WQE + Doorbell）→ 完成（CQE / Quiet）</text>
  <text x="1250" y="300" text-anchor="middle" font-size="13" fill="#145a32">数据 0 次内核拷贝：网卡 DMA 在两端注册内存之间直达 · 完全绕过内核协议栈</text>

  <!-- 指标 -->
  <g text-anchor="middle">
    <rect x="886" y="344" width="229" height="56" rx="10" fill="#eafaf1" stroke="#82e0aa" stroke-width="1.5"/>
    <text x="1000" y="378" font-size="14.5"><tspan font-weight="bold" fill="#1e8449">时延</tspan><tspan fill="#0b3d20">｜~1–2 μs（RoCE）</tspan></text>
    <rect x="1135" y="344" width="229" height="56" rx="10" fill="#eafaf1" stroke="#82e0aa" stroke-width="1.5"/>
    <text x="1249" y="378" font-size="14.5"><tspan font-weight="bold" fill="#1e8449">带宽</tspan><tspan fill="#0b3d20">｜接近线缆速率</tspan></text>
    <rect x="1384" y="344" width="229" height="56" rx="10" fill="#eafaf1" stroke="#82e0aa" stroke-width="1.5"/>
    <text x="1498" y="378" font-size="14.5"><tspan font-weight="bold" fill="#1e8449">消息率</tspan><tspan fill="#0b3d20">｜极高（NBI 批量提交）</tspan></text>
  </g>
</svg>
